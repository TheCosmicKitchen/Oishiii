<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F6EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oishii">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Oishii</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Mochiy+Pop+One&display=swap">
<style>
/* Kana Garden — a pocket kitchen garden: soil beds, wooden stakes, sakura accents.
   Layout: single phone-width column, sticky header, bottom tab bar. */
:root{
  --bg:#F1F6EA; --surface:#FFFFFF; --surface-2:#E5EFDC; --ink:#22362A; --ink-soft:#5C7264;
  --leaf:#4E9F69; --leaf-deep:#2E7647; --sakura:#EE7299; --sakura-soft:#FCE2EB;
  --soil:#9C6B4A; --soil-deep:#704731; --stake:#E9CFA3; --sun:#F5C24F; --sky:#D3ECF6;
  --line:#D2E1C9; --good:#3E9A5E; --near:#E6AE2E; --kin:#4F9FD0; --bad:#D9534F; --on-accent:#FFFFFF; --shadow:rgba(40,70,45,.14);
  --f-display:"Mochiy Pop One","M PLUS Rounded 1c",system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c",system-ui,-apple-system,"Hiragino Maru Gothic ProN",sans-serif;
  --f-glyph:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12201A; --surface:#1A2B22; --surface-2:#22372B; --ink:#E7F2E2; --ink-soft:#A6BFAE;
  --leaf:#6CC488; --leaf-deep:#94DDAA; --sakura:#FF8FB3; --sakura-soft:#3B2431;
  --soil:#6B4834; --soil-deep:#4C3223; --stake:#C9AC80; --sun:#EFC15A; --sky:#1E3845;
  --line:#2D4838; --good:#5DBB7C; --near:#E3B04A; --kin:#62B3E0; --bad:#F07A76; --on-accent:#0F2117; --shadow:rgba(0,0,0,.4);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#12201A; --surface:#1A2B22; --surface-2:#22372B; --ink:#E7F2E2; --ink-soft:#A6BFAE;
  --leaf:#6CC488; --leaf-deep:#94DDAA; --sakura:#FF8FB3; --sakura-soft:#3B2431;
  --soil:#6B4834; --soil-deep:#4C3223; --stake:#C9AC80; --sun:#EFC15A; --sky:#1E3845;
  --line:#2D4838; --good:#5DBB7C; --near:#E3B04A; --kin:#62B3E0; --bad:#F07A76; --on-accent:#0F2117; --shadow:rgba(0,0,0,.4);
  color-scheme:dark; }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sakura);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.glyph{font-family:var(--f-glyph);font-weight:600;line-height:1}
.ro{font-size:.78em;color:var(--ink-soft);letter-spacing:.02em}
.em{display:inline-block;vertical-align:middle;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
.muted{color:var(--ink-soft)}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.logo{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.logo h1{font-size:1.25rem;white-space:nowrap}
.logo small{font-family:var(--f-glyph);color:var(--sakura);font-size:.95rem}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-weight:700;font-size:.85rem;white-space:nowrap}
.chip .em{width:22px;height:22px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1.5px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{background:none;border:0;border-radius:var(--r-md);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.72rem;font-weight:700;color:var(--ink-soft)}
.tab .em{width:30px;height:30px;transition:transform .2s}
.tab .jp{font-family:var(--f-glyph);font-size:.8rem}
.tab[aria-current="true"]{background:var(--sakura-soft);color:var(--ink)}
.tab[aria-current="true"] .em{transform:translateY(-2px) scale(1.08)}

/* generic */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:var(--leaf);color:var(--on-accent);box-shadow:0 3px 0 var(--leaf-deep);transition:transform .08s, box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--leaf-deep)}
.btn.pink{background:var(--sakura);box-shadow:0 3px 0 color-mix(in srgb,var(--sakura) 70%,var(--ink))}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.small{padding:7px 13px;font-size:.85rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .em{width:22px;height:22px}
.iconbtn{background:var(--surface-2);border:0;border-radius:999px;width:40px;height:40px;display:inline-grid;place-items:center;flex:none}
.iconbtn .em{width:24px;height:24px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:800;background:var(--surface-2);color:var(--ink-soft)}
.pill.done{background:var(--leaf);color:var(--on-accent)}
.pill.pink{background:var(--sakura-soft);color:var(--sakura)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .3s}

/* garden */
.hello{display:flex;gap:12px;align-items:center;background:linear-gradient(180deg,var(--sky),var(--surface));border:1.5px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.hello .em{width:58px;height:58px;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
.stat{background:var(--surface);border-radius:var(--r-md);padding:6px 8px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.15rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.7rem;color:var(--ink-soft);font-weight:700}
.bed{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:12px 12px 14px}
.bed header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bed header .glyph{font-size:1.3rem}
.soil{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--soil);border-radius:16px;padding:8px;box-shadow:inset 0 -5px 0 var(--soil-deep)}
.plot{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:12px;background:color-mix(in srgb,var(--soil-deep) 55%,var(--soil));border:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px 2px 6px;gap:2px;min-width:0}
.plot .em{width:70%;max-width:52px;height:auto;aspect-ratio:1}
.plot .stake{background:var(--stake);color:#3d2a1a;border-radius:6px;padding:1px 6px 2px;font-family:var(--f-glyph);font-weight:600;font-size:1.15rem;line-height:1.1;box-shadow:0 2px 0 rgba(0,0,0,.18);text-align:center}
.plot .stake small{display:block;font-family:var(--f-body);font-size:.6rem;font-weight:700;opacity:.75;line-height:1}
.plot.empty{border:2px dashed color-mix(in srgb,var(--stake) 55%,transparent);background:transparent;justify-content:center;color:var(--stake);font-weight:800;font-size:.72rem}
.plot.empty .em{width:46%;opacity:.95}
.plot.wilt .em{filter:saturate(.35) brightness(.9)}
.plot .drop{position:absolute;top:4px;right:4px;width:16px;height:16px}
.plot .drop .em{width:16px}
.bed.locked{opacity:.7}
.bed.locked .soil{filter:grayscale(.6)}
.lockmsg{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink-soft)}
.lockmsg .em{width:24px;height:24px}

/* pot */
.pot{background:linear-gradient(180deg,var(--sakura-soft),var(--surface));}
.potstage{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}
.potstage > .em{width:84px;height:84px}
.slots{display:flex;gap:6px}
.slot{width:46px;height:54px;border-radius:12px;border:2px dashed var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--f-glyph);font-weight:600;font-size:1.5rem}
.slot.filled{border-style:solid;border-color:var(--sakura)}
.tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tile{min-width:44px;height:52px;border-radius:12px;border:0;background:var(--surface-2);box-shadow:0 3px 0 var(--line);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px;touch-action:none;user-select:none}
.tile .glyph{font-size:1.45rem}
.tile .ro{font-size:.62rem;line-height:1;margin-top:2px}
.tile.sel{background:var(--sakura);color:var(--on-accent);box-shadow:0 3px 0 color-mix(in srgb,var(--sakura) 60%,var(--ink));transform:translateY(-3px)}
.tile.sel .ro{color:inherit}
.tile.used{opacity:.3;pointer-events:none}
.hints{display:flex;flex-wrap:wrap;gap:6px}
.hint{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:.8rem;font-weight:700}
.hint .em{width:26px;height:26px}
.hint .dots{letter-spacing:2px;color:var(--sakura)}

/* reveal card */
.reveal{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.reveal .big{font-size:5rem}
.reveal .em{width:72px;height:72px}
.reveal .rd{font-family:var(--f-glyph);font-size:1.4rem;font-weight:600}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.bounce{animation:bounce .5s}
@keyframes bounce{30%{transform:translateY(-12px) scale(1.06)}60%{transform:translateY(0) scale(.97)}}

/* play overlay */
.play{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.play .inner{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.playhead{display:flex;align-items:center;gap:10px}
.playhead h2{flex:1;min-width:0}
.hud{display:flex;gap:6px;flex-wrap:wrap}

/* lesson + quiz */
.lesson{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.lesson .big{font-size:7rem;color:var(--ink)}
.lesson .romaji{font-family:var(--f-display);font-size:1.6rem;color:var(--sakura)}
.hintword{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:var(--r-md);padding:10px 14px;text-align:left}
.hintword .em{width:56px;height:56px}
.hintword .glyph{font-size:1.5rem}
.quizq{text-align:center;padding:10px 0}
.quizq .big{font-size:5.2rem}
.quizq .romaji{font-family:var(--f-display);font-size:2.2rem}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choice{border:0;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line);padding:14px 6px;font-size:1.3rem;font-weight:800;min-height:64px}
.choice .glyph{font-size:2rem}
.choice.right{background:var(--good);color:var(--on-accent);border-color:var(--good)}
.choice.wrong{background:var(--bad);color:var(--on-accent);border-color:var(--bad)}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:9px;background:var(--surface-2)}
.progress i.ok{background:var(--leaf)} .progress i.no{background:var(--bad)} .progress i.now{background:var(--sakura)}

/* sushi */
.sushi-wrap{display:flex;flex-direction:column;gap:12px;user-select:none}
.belt{position:relative;height:118px;border-radius:18px;overflow:hidden;background:
  repeating-linear-gradient(90deg,color-mix(in srgb,var(--soil) 70%,var(--surface)) 0 38px,color-mix(in srgb,var(--soil) 85%,var(--surface)) 38px 40px);
  box-shadow:inset 0 8px 0 var(--soil-deep),inset 0 -8px 0 var(--soil-deep);touch-action:none}
.belt.moving{animation:beltmove 1s linear infinite}
@keyframes beltmove{to{background-position:-40px 0}}
.plate{position:absolute;top:17px;left:0;width:84px;height:84px;border-radius:50%;border:0;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%,#FBF7EE 0 52%,var(--pc) 53% 62%,#FBF7EE 63% 100%);box-shadow:0 5px 0 rgba(0,0,0,.18);touch-action:none;will-change:transform;padding:0}
.plate .glyph{font-size:1.9rem;color:#2B2016;position:relative}
.plate.small .glyph{font-size:1.25rem}
.plate.tiny .glyph{font-size:.95rem}
.plate.sel{outline:4px solid var(--sakura);outline-offset:2px}
.plate.gold{background:radial-gradient(circle at 50% 50%,#FFF6DB 0 52%,#E8B53A 53% 62%,#FFF6DB 63% 100%)}
.plate.gold::after{content:"";position:absolute;inset:-4px;border-radius:50%;box-shadow:0 0 14px 3px rgba(240,190,60,.7);animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.4}to{opacity:1}}
.counter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seat{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.seat.target{border-color:var(--sakura);background:var(--sakura-soft)}
.bubble{position:relative;width:100%;background:var(--surface-2);border-radius:14px;padding:6px 4px;text-align:center;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bubble::after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--surface-2);border-bottom:0}
.bubble .em{width:38px;height:38px}
.bubble .want{font-weight:800;font-size:.78rem;line-height:1.15;overflow-wrap:anywhere}
.bubble .wro{font-family:var(--f-display);font-size:.95rem;color:var(--sakura);line-height:1.1}
.budimg{width:58px;height:58px;margin-top:6px;transition:transform .2s}
.seat .name{font-size:.72rem;font-weight:800}
.seat .lv{position:absolute;top:-8px;right:-4px;background:var(--leaf);color:var(--on-accent);border-radius:99px;font-size:.66rem;font-weight:800;padding:1px 7px}
.patience{width:90%;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.patience i{display:block;height:100%;background:var(--leaf)}
.patience i.low{background:var(--bad)}
.floaty{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-family:var(--f-display);color:var(--sakura);pointer-events:none;animation:floaty 1s forwards;white-space:nowrap;font-size:.95rem;z-index:3}
@keyframes floaty{to{transform:translate(-50%,-40px);opacity:0}}
.eatfx{position:absolute;inset:auto 0 30px;text-align:center;font-family:var(--f-glyph);font-weight:600;font-size:.85rem;color:var(--ink-soft)}
.hearts{display:inline-flex;gap:2px}
.hearts .em{width:20px;height:20px}
.hearts .gone{filter:grayscale(1);opacity:.35}
.sushitip{font-size:.8rem;color:var(--ink-soft);text-align:center}

/* puzzle hub */
.bouquet{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pz{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pz .em.icon{width:44px;height:44px}
.pz h3{font-size:.98rem}
.pz p{font-size:.78rem;color:var(--ink-soft);line-height:1.35;flex:1}
.pz .row{gap:6px}
.pz.done{border-color:var(--leaf)}
.bouquet-card{display:flex;align-items:center;gap:12px}
.bouquet-card > .em{width:48px;height:48px}
.flowers{display:flex;gap:2px}
.flowers .em{width:26px;height:26px}
.flowers .off{filter:grayscale(1);opacity:.3}

/* petal guess */
.pg-grid{display:flex;flex-direction:column;gap:6px;align-items:center}
.pg-row{display:flex;gap:6px}
.pg-cell{width:54px;height:54px;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--f-glyph);font-weight:600;font-size:1.7rem;position:relative}
.pg-cell small{position:absolute;bottom:2px;font-family:var(--f-body);font-size:.55rem;font-weight:800;opacity:.8}
.pg-cell.cur{border-color:var(--sakura)}
.pg-cell.hit{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.pg-cell.near{background:var(--near);border-color:var(--near);color:#2A1E00}
.pg-cell.kin{background:var(--kin);border-color:var(--kin);color:var(--on-accent)}
.pg-cell.miss{background:var(--surface-2);color:var(--ink-soft)}
.pg-cell.flip{animation:flip .45s}
@keyframes flip{50%{transform:rotateX(90deg)}}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;font-weight:700;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.kb{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;direction:rtl}
.kb button{direction:ltr;border:0;border-radius:8px;background:var(--surface);box-shadow:0 2px 0 var(--line);padding:5px 0 3px;display:flex;flex-direction:column;align-items:center;min-width:0}
.kb button .glyph{font-size:1.15rem}
.kb button .ro{font-size:.55rem;line-height:1}
.kb button.hit{background:var(--good);color:var(--on-accent)} .kb button.near{background:var(--near);color:#2A1E00} .kb button.kin{background:var(--kin);color:var(--on-accent)} .kb button.miss{opacity:.35}
.kb button.hit .ro,.kb button.kin .ro,.kb button.near .ro{color:inherit}
.kb .blank{visibility:hidden}
.clue{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:10px;min-height:64px}
.clue .em{width:44px;height:44px}
.clue .glyph{font-size:2.4rem}

/* sudoku */
.sd{display:grid;grid-template-columns:repeat(6,1fr);border:3px solid var(--ink);border-radius:12px;overflow:hidden;max-width:380px;width:100%;margin:0 auto;background:var(--surface)}
.sd button{aspect-ratio:1;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--f-glyph);font-weight:600;font-size:1.45rem;padding:0;min-width:0}
.sd button.given{background:var(--surface-2);color:var(--ink)}
.sd button.given.asro{font-family:var(--f-display);font-weight:400;font-size:.9rem;color:var(--leaf-deep)}
.sd button.user{color:var(--sakura)}
.sd button.selcell{background:var(--sakura-soft)}
.sd button.peer{background:color-mix(in srgb,var(--sakura-soft) 45%,var(--surface))}
.sd button.bad{color:var(--bad);text-decoration:underline wavy}
.sd button.c2{border-right:3px solid var(--ink)} .sd button.r1{border-bottom:3px solid var(--ink)}
.palette{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:380px;width:100%;margin:0 auto}
.palette button{border:0;border-radius:12px;background:var(--surface);box-shadow:0 3px 0 var(--line);padding:8px 0;display:flex;flex-direction:column;align-items:center}
.palette .glyph{font-size:1.4rem}

/* logic */
.lg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:340px;width:100%;margin:0 auto;background:color-mix(in srgb,var(--leaf) 22%,var(--surface));padding:10px;border-radius:20px}
.lg-cell{aspect-ratio:1;border-radius:14px;border:2px dashed color-mix(in srgb,var(--leaf) 50%,transparent);background:var(--surface);display:grid;place-items:center;padding:0;position:relative}
.lg-cell .em{width:62%;height:auto}
.lg-cell.wrong{border:2px solid var(--bad)}
.lg-cell.right{border:2px solid var(--good)}
.lg-axis{display:flex;justify-content:space-around;max-width:340px;margin:0 auto;width:100%;font-size:.72rem;font-weight:800;color:var(--ink-soft);text-align:center}
.lg-tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:68px}
.lg-item{width:62px;height:62px;border-radius:16px;border:0;background:var(--surface);box-shadow:0 3px 0 var(--line);display:grid;place-items:center;touch-action:none;padding:0;position:relative}
.lg-item .em{width:44px;height:44px}
.lg-item.sel{background:var(--sakura-soft);outline:3px solid var(--sakura)}
.lg-item .lbl{position:absolute;bottom:-4px;right:-4px;background:var(--stake);color:#3d2a1a;border-radius:6px;font-family:var(--f-glyph);font-size:.8rem;padding:0 4px}
.clues{display:flex;flex-direction:column;gap:8px}
.cluerow{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:9px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;width:100%}
.cluerow .jp{font-family:var(--f-glyph);font-weight:600;font-size:1.15rem}
.cluerow .kn{font-family:var(--f-glyph);font-size:.92rem;color:var(--ink-soft)}
.cluerow .en{font-size:.82rem;color:var(--leaf-deep);font-weight:700}
.cluerow.struck{opacity:.45}

/* missing half */
.mh-box{display:grid;gap:4px;width:184px;height:184px;margin:0 auto;padding:8px;border-radius:20px;background:var(--surface);border:2px solid var(--line)}
.mh-box.lr{grid-template-columns:1fr 1fr}
.mh-box.tb{grid-template-rows:1fr 1fr}
.mh-box.out{grid-template-columns:1fr;place-items:center;position:relative}
.mh-part{border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-glyph);font-weight:600;font-size:3.4rem;background:var(--surface-2);min-width:0;min-height:0}
.mh-part.filled{border-style:solid;border-color:var(--leaf);background:var(--surface)}
.mh-box.out .outer{position:absolute;inset:8px;display:grid;place-items:start center;font-family:var(--f-glyph);font-size:9rem;font-weight:600;line-height:1;color:color-mix(in srgb,var(--ink) 30%,transparent);pointer-events:none}
.mh-box.out .mh-part{width:86px;height:86px;margin-top:40px;z-index:1}
.mh-done{font-size:8rem}
.kanji-tiles .tile .glyph{font-size:1.9rem}
.kanji-tiles .tile{min-width:58px;height:62px}

/* number line */
.nl{display:flex;gap:6px;align-items:stretch;justify-content:center;flex-wrap:wrap;position:relative}
.nl-slot{flex:1 1 0;min-width:58px;max-width:110px;min-height:76px;border-radius:14px;border:2px dashed var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;position:relative}
.nl-slot.fixed{border-style:solid;background:var(--surface-2)}
.nl-slot .glyph{font-size:1.25rem;text-align:center;line-height:1.15;overflow-wrap:anywhere}
.nl-slot .em{width:30px;height:30px}
.nl-slot.right{border:2px solid var(--good)} .nl-slot.wrong{border:2px solid var(--bad)}
.nl-axis{height:6px;border-radius:9px;background:linear-gradient(90deg,var(--sky),var(--leaf));position:relative;margin:2px 4px}
.nl-axis::after{content:"";position:absolute;right:-4px;top:-5px;border:8px solid transparent;border-left-color:var(--leaf);border-right:0}
.nl-cap{display:flex;justify-content:space-between;font-size:.72rem;font-weight:800;color:var(--ink-soft)}
.nl-tile{min-width:64px;min-height:58px;padding:4px 8px}
.nl-tile .glyph{font-size:1.15rem;text-align:center;line-height:1.15}
.nl-tile .em{width:26px;height:26px}

/* results */
.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.result .em.big{width:96px;height:96px}
.result .score{font-family:var(--f-display);font-size:2rem}
.sharebox{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:.8rem;background:var(--surface-2);border-radius:var(--r-md);padding:10px;white-space:pre-wrap;text-align:left;user-select:all}

/* book */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.kcard{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:6px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.kcard .glyph{font-size:1.7rem}
.kcard .em{width:24px;height:24px}
.kcard small{font-size:.62rem;font-weight:700;color:var(--ink-soft);line-height:1.15;overflow-wrap:anywhere}
.kcard.locked{opacity:.45}
.kcard.locked .glyph{color:transparent;text-shadow:0 0 0 var(--line)}
.chart{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.chart div{border-radius:10px;padding:4px 0;text-align:center;background:var(--surface-2)}
.chart div .glyph{font-size:1.2rem}
.chart div.s1{background:color-mix(in srgb,var(--leaf) 25%,var(--surface))} .chart div.s2{background:color-mix(in srgb,var(--leaf) 50%,var(--surface))} .chart div.s3{background:var(--sakura-soft);outline:2px solid var(--sakura)}
.chart div.none{opacity:.35}
.budrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.budcard{background:var(--surface-2);border-radius:var(--r-md);padding:8px;text-align:center}
.budcard .em{width:48px;height:48px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
input[type=text]{font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface);color:var(--ink);width:100%}
label.lab{font-weight:800;font-size:.85rem}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti span{position:absolute;top:-30px;width:14px;height:12px;border-radius:12px 0 12px 0;background:var(--sakura);animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg);opacity:.2}}
.dragghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);opacity:.92}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:800;font-size:.9rem;z-index:80;animation:pop .3s;max-width:90vw;text-align:center}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .belt.moving{animation:none}
}
@media (max-width:380px){ .pg-cell{width:46px;height:46px;font-size:1.45rem} .plate{width:74px;height:74px} .belt{height:106px} }
.kinput{display:flex;gap:8px;align-items:center}
.kinput input{font-family:var(--f-glyph);font-weight:600;font-size:1.4rem;text-align:center;padding:10px 12px;border-radius:14px}
.kinput input.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--surface))}
.kinput input.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.typehint{font-size:.75rem;color:var(--ink-soft);text-align:center}
/* station stamps (駅スタンプ) — real ink on real paper, so the paper stays light in both themes */
.stamp{position:relative;flex:none;display:grid;place-items:center;transform:rotate(var(--rot));opacity:.92}
.stamp svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stamp-k{font-family:var(--f-glyph);font-weight:600;color:var(--ink);font-size:calc(var(--sz,96px) * .3);line-height:1;position:relative;top:-2%}
.stamp-e{position:absolute;width:24%!important;height:24%!important;bottom:20%;left:50%;transform:translateX(-50%);filter:grayscale(1) sepia(1) saturate(3) hue-rotate(-30deg);opacity:.75}
.stamp.thunk{animation:thunk .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes thunk{0%{transform:rotate(var(--rot)) scale(2.4);opacity:0}55%{transform:rotate(var(--rot)) scale(.92);opacity:1}100%{transform:rotate(var(--rot)) scale(1)}}
.stampover{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 35%,transparent);padding:24px}
.stampcard{background:#FBF6EA;color:#3A2E22;border-radius:22px;padding:18px 26px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 12px 40px rgba(0,0,0,.3);max-width:300px;text-align:center}
.stampcard .ro,.stampcard .muted,.stampcard .eyebrow{color:#7A6A58}
.stampbook{background:#FBF6EA;color:#3A2E22;border-radius:var(--r-lg);padding:14px;border:1.5px solid #E6DCC6;
  background-image:linear-gradient(#EFE6D2 1px,transparent 1px);background-size:100% 28px}
.stampbook h2,.stampbook h3{color:#3A2E22}
.stampbook .muted,.stampbook .ro{color:#7A6A58}
.stampgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px 8px;justify-items:center}
.stampslot{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.stampslot .empty{width:84px;height:84px;border-radius:50%;border:2px dashed #D8CBB0;display:grid;place-items:center;color:#B9A888;font-family:var(--f-glyph);font-size:1.4rem}
.stampslot small{font-size:.66rem;font-weight:700;color:#7A6A58}
.stamppage-h{display:flex;align-items:center;gap:8px;margin:14px 0 8px;padding-bottom:4px;border-bottom:2px solid #3A2E22}
.stamppage-h .glyph{font-size:1.3rem}
.mh-part .ro{font-size:.8rem;font-family:var(--f-body);font-weight:700}

// ---- kana -> romaji (handles dakuten, small ya/yu/yo, small tsu, long vowels as written)
const RO_EXTRA = {"が":"ga","ぎ":"gi","ぐ":"gu","げ":"ge","ご":"go","ざ":"za","じ":"ji","ず":"zu","ぜ":"ze","ぞ":"zo","だ":"da","ぢ":"ji","づ":"zu","で":"de","ど":"do",

function romaji(s) {
  let out = "", i = 0; const a = [...s];
  while (i < a.length) {
    const c = a[i], n = a[i + 1];
    if (c === "っ") { const nx = romaji(a.slice(i + 1).join("")); out += nx ? nx[0] : ""; i++; continue; }
    let r = c === "を" ? "o" : (KANA_RO[c] || RO_EXTRA[c] || c);
    if (n && "ゃゅょ".includes(n)) { const y = RO_EXTRA[n]; r = (r.endsWith("i") ? r.slice(0, -1) : r); if (/^(sh|ch|j)$/.test(r)) r += y.slice(1); else r += y; i += 2; out += r; continue; }
    out += r; i++;
  }
  return out;
}

// ---- numbers
const DIG = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
function toKanji(n) {
  if (n === 0) return "零"; let s = "";
  const man = Math.floor(n / 10000); if (man) { s += toKanji(man) + "万"; n %= 10000; }
  const units = [[1000, "千"], [100, "百"], [10, "十"]];
  for (const [u, ch] of units) { const d = Math.floor(n / u); if (d) { s += (d === 1 ? "" : DIG[d]) + ch; } n %= u; }
  if (n) s += DIG[n]; return s;
}
const RD = ["", "いち", "に", "さん", "よん", "ご", "ろく", "なな", "はち", "きゅう"];
function toYomi(n) {
  let s = "";
  const man = Math.floor(n / 10000); if (man) { s += toYomi(man) + "まん"; n %= 10000; }
  const th = Math.floor(n / 1000); if (th) { s += th === 1 ? "せん" : th === 3 ? "さんぜん" : th === 8 ? "はっせん" : RD[th] + "せん"; } n %= 1000;
  const hu = Math.floor(n / 100); if (hu) { s += hu === 1 ? "ひゃく" : hu === 3 ? "さんびゃく" : hu === 6 ? "ろっぴゃく" : hu === 8 ? "はっぴゃく" : RD[hu] + "ひゃく"; } n %= 100;
  const te = Math.floor(n / 10); if (te) { s += te === 1 ? "じゅう" : RD[te] + "じゅう"; } n %= 10;
  if (n) s += RD[n]; return s;
}

// ---- seeded random
function hashStr(s) { let h = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return (h >>> 0); }
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeRng(seed) { const r = mulberry(hashStr(String(seed))); return { f: r, int: n => Math.floor(r() * n), pick: a => a[Math.floor(r() * a.length)], shuffle: a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; } }; }
const RND = makeRng(Date.now() + ":" + Math.random());
function todayKey(d = new Date()) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

function kanaStage(k) { const s = S.kana[k]; if (!s) return -1; return s.pts >= 7 ? 2 : s.pts >= 3 ? 1 : 0; }
function isWilting(k) { const s = S.kana[k]; return s && now() - (s.last || 0) > 2 * DAY; }
function waterKana(k, ok = true) { const s = S.kana[k]; if (!s) return; if (ok) s.pts = Math.min(20, s.pts + 1); s.last = now(); }

function touchWord(w, ok = true, found = true) {
  const key = wkey(w); const s = S.words[key] || (S.words[key] = { pts: 0, last: 0, found: false, miss: 0 });
  const isNew = found && !s.found;

const STAMP_Q = []; let stampBusy = false;

  const o = document.createElement("div"); o.className = "stampover"; o.setAttribute("role", "status");

let AC = null;
function tone(freqs, dur = .12, type = "sine", gain = .08) {
  if (!S.sound) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t0 = AC.currentTime;
    freqs.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, t0 + i * dur * .7); g.gain.linearRampToValueAtTime(gain, t0 + i * dur * .7 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + i * dur * .7 + dur); o.connect(g).connect(AC.destination); o.start(t0 + i * dur * .7); o.stop(t0 + i * dur * .7 + dur + .02); });
  } catch (e) { }
}
const SFX = { good: () => tone([660, 880], .12, "triangle"), bad: () => tone([220, 180], .14, "square", .04), pop: () => tone([523, 659, 784, 1046], .1, "triangle"), tap: () => tone([440], .05, "sine", .04), win: () => tone([523, 659, 784, 1046, 1318], .14, "triangle", .07) };

// watering quiz
function startWater() {
  const pool = plantedKana(); if (!pool.length) return;
  const n = Math.min(10, Math.max(5, pool.length * 2));
  const weight = x => (isWilting(x.k) ? 6 : 1) + Math.max(0, 8 - (S.kana[x.k].pts));
  const qs = [];
  for (let i = 0; i < n; i++) { let tot = pool.reduce((a, x) => a + weight(x), 0), r = RND.f() * tot; let pick = pool[0]; for (const x of pool) { r -= weight(x); if (r <= 0) { pick = x; break; } } if (qs.length && qs[qs.length - 1].k === pick.k && pool.length > 1) { i--; continue; } qs.push({ k: pick.k, ro: pick.ro, type: RND.f() < .5 ? "k2r" : "r2k" }); }
  openPlay("Watering time", (st, hud) => {
    let i = 0, right = 0; const res = [];
    const next = () => {
      if (i >= qs.length) { save(); SFX.win(); if (right === qs.length) confetti(); return resultScreen(st, { icon: right >= qs.length * .8 ? "sunflower" : "droplet", title: right === qs.length ? "Perfect watering!" : "The garden says thanks!", score: `${right} / ${qs.length}`, lines: ["Every right answer adds a drop. Plants bud at 3 drops and bloom at 7."], again: startWater, againLabel: "Water again" }); }
      const q = qs[i];
      const distract = () => { const opts = new Set([q.k]); const la = LOOKALIKE_KANA[q.k]; if (la && RND.f() < .7) opts.add(la); const others = RND.shuffle(ALL_KANA.filter(x => x.k !== q.k && x.k !== "を")); const pl = RND.shuffle(pool.filter(x => x.k !== q.k)); for (const x of [...pl, ...others]) { if (opts.size >= 4) break; opts.add(x.k); } return RND.shuffle([...opts]); };
      const opts = distract();
      st.innerHTML = `<div class="progress">${qs.map((_, j) => `<i class="${j < i ? (res[j] ? "ok" : "no") : j === i ? "now" : ""}"></i>`).join("")}</div>
       <div class="card quizq">${q.type === "k2r" ? `<span class="eyebrow">How do you read this?</span><div class="glyph big pop">${q.k}</div>` : `<span class="eyebrow">Which kana is this sound?</span><div class="romaji pop">${q.ro}</div><button class="btn ghost small" data-say="${q.k}">${IMG("speaker")}Hear it</button>`}</div>
       <div class="choices">${opts.map(o => `<button class="choice" data-o="${o}">${q.type === "k2r" ? (o === "を" ? "o (wo)" : KANA_RO[o]) : `<span class="glyph">${o}</span>`}</button>`).join("")}</div>`;
      $$(".choice", st).forEach(b => b.onclick = () => {
        if (st.dataset.lock) return; st.dataset.lock = 1;
        const ok = b.dataset.o === q.k; res[i] = ok;
        b.classList.add(ok ? "right" : "wrong"); if (!ok) $(`.choice[data-o="${q.k}"]`, st).classList.add("right");
        if (ok) { right++; waterKana(q.k); SFX.good(); } else { SFX.bad(); S.kana[q.k].last = now(); }
        say(q.k);
        setTimeout(() => { delete st.dataset.lock; i++; next(); }, ok ? 650 : 1400);
      });
    };
    next();
  });
}

function startSushi(mode) {
  openPlay(mode === "endless" ? "Sushi Belt" : "Chef's Special", (st, hud) => {
    const rng = mode === "endless" ? RND : makeRng(todayKey() + ":sushi");
    const timed = mode !== "endless"; const LIMIT = 90000;
    st.innerHTML = `<div class="sushi-wrap"><div class="belt moving" id="belt"></div><div class="counter" id="counter">${BUDS.map((b, i) => `<div class="seat" data-drop="${i}" id="seat${i}"></div>`).join("")}</div><p class="sushitip">Drag a plate to the bud who wants it, or tap the plate, then tap the bud.</p></div>`;
    const belt = $("#belt", st);
    let yen = 0, combo = 0, bestCombo = 0, hearts = 3, served = 0, elapsed = 0, last = 0, raf = 0, over = false, plateId = 0, paused = false;
    const missed = new Map(); const newStamps = []; const plates = []; const seats = BUDS.map(() => ({ order: null, wait: 0, msg: "", msgT: 0 }));
    const poolFor = b => UNIQUE_WORDS.filter(w => BUD_THEMES[b.id].includes(w.t) && ([...w.k].length === 1 || bud(b.id).lvl >= 3) && (S.role === "kanji" || w.r.length <= 5));
    function newOrder(i) {
      const b = BUDS[i]; const active = new Set(seats.map(s => s.order && faceOf(s.order.w)));
      const pool = poolFor(b).filter(w => !active.has(faceOf(w)));
      const wt = w => { const s = wordState(w); return 1 + Math.max(0, 6 - (s ? s.pts : 0)) + (s ? s.miss * 2 : 0); };
      let tot = pool.reduce((a, w) => a + wt(w), 0), r = rng.f() * tot, pick = pool[0];
      for (const w of pool) { r -= wt(w); if (r <= 0) { pick = w; break; } }
      const max = Math.max(8000, 17000 - elapsed / 10);
      seats[i].order = { w: pick, t: max, max }; drawSeat(i);
    }
    function drawSeat(i, anim) {
      const b = BUDS[i], s = seats[i], el = $("#seat" + i, st), o = s.order; const bs = bud(b.id);
      let bubble;
      if (s.msg) bubble = `<div class="glyph" style="font-size:1.3rem">${s.msg}</div><div class="ro">${s.msgRo || ""}</div>`;
      else if (o) bubble = `${IMG(o.w.e)}${S.role === "kana" && showRo() ? `<div class="wro">${esc(o.w.ro)}</div>` : ""}<div class="want">${esc(o.w.en)}</div>`;
      else bubble = `<div class="muted">…</div>`;
      el.innerHTML = `<span class="lv">Lv ${bs.lvl}</span><div class="bubble">${bubble}</div><div class="patience"><i></i></div>${IMG(budSprite(b)).replace('class="em"', 'class="em budimg"')}<span class="name">${b.name}</span>`;
      if (anim) { el.classList.remove("bounce", "shake"); void el.offsetWidth; el.classList.add(anim); }
    }
    function spawnPlate() {
      const W = belt.clientWidth; const open = seats.filter(s => s.order).map(s => s.order.w);
      let w = null, face;
      const onBelt = f => plates.filter(p => p.face === f).length;
      if (open.length && rng.f() < .6) { const sorted = [...open].sort((a, b) => onBelt(faceOf(a)) - onBelt(faceOf(b))); w = sorted[0]; face = faceOf(w); }
      else if (open.length && rng.f() < .65) { // decoy based on an open order
        const base = rng.pick(open);
        if (S.role === "kanji") { const la = LOOKALIKE_KANJI[base.k]; face = la ? rng.pick(la) : rng.pick(UNIQUE_WORDS).k; }
        else { const ch = [...base.r]; const idx = ch.map((c, j) => LOOKALIKE_KANA[c] ? j : -1).filter(j => j >= 0); if (idx.length) { const j = rng.pick(idx); ch[j] = LOOKALIKE_KANA[ch[j]]; face = ch.join(""); } else face = rng.pick(UNIQUE_WORDS).r; }
      } else { w = rng.pick(UNIQUE_WORDS.filter(x => [...x.k].length === 1)); face = faceOf(w); }
      let r = rng.f(), tier = TIERS[0]; for (const t of TIERS) { r -= t.p; if (r <= 0) { tier = t; break; } }
      const el = document.createElement("button"); const id = "p" + (plateId++);
      const len = [...face].length;
      el.className = "plate" + (tier.gold ? " gold" : "") + (len >= 4 ? " tiny" : len >= 3 || (S.role === "kanji" && len >= 2) ? " small" : "");
      el.style.setProperty("--pc", tier.c); el.dataset.pick = id; el.setAttribute("aria-label", "plate " + face);
      el.innerHTML = `<span class="glyph">${esc(face)}</span>`;
      belt.appendChild(el);
      plates.push({ id, face, tier, x: W + 10, el });
    }
    function serve(pid, seatIdx) {
      const p = plates.find(x => x.id === pid); const s = seats[seatIdx]; if (!p || !s || !s.order || over) return;
      const want = s.order.w; const b = BUDS[seatIdx];
      if (p.face === faceOf(want)) {
        combo++; bestCombo = Math.max(bestCombo, combo); served++; S.served = (S.served || 0) + 1;
        const mult = 1 + Math.min(4, Math.floor(combo / 4)) * .25; const gain = Math.round(p.tier.yen * mult); yen += gain;
        p.el.remove(); plates.splice(plates.indexOf(p), 1);
        if (touchWord(want, true, true)) { newStamps.push(want); toast(`New stamp: ${want.k}!`); }
        const bs = bud(b.id); bs.xp++; const need = 4 + bs.lvl * 2; if (bs.xp >= need) { bs.xp = 0; bs.lvl++; toast(`${b.name} grew to level ${bs.lvl}!`); SFX.win(); confetti(16); }
        s.msg = rng.f() < .5 ? "おいしい！" : "うまい！"; s.msgRo = (s.msg === "おいしい！" ? "oishii! " : "umai! ") + `· ${want.k} ${want.r}`; s.msgT = 1100; s.order = null; drawSeat(seatIdx, "bounce");
        const f = document.createElement("div"); f.className = "floaty"; f.textContent = "+¥" + gain + (mult > 1 ? ` ×${mult}` : ""); $("#seat" + seatIdx, st).appendChild(f); setTimeout(() => f.remove(), 1000);
        SFX.good(); say(want.r); drawHud();
      } else {
        combo = 0; s.order.t -= s.order.max * .25; touchWord(want, false, false); missed.set(wkey(want), want);
        s.msg = "ちがう…"; s.msgRo = "chigau… not this one"; s.msgT = 900; drawSeat(seatIdx, "shake"); SFX.bad(); drawHud();
      }
      save();
    }
    function drawHud() {
      hud.innerHTML = `<span class="chip">${IMG("coin")}¥${yen.toLocaleString()}</span>${combo >= 3 ? `<span class="chip">${IMG("fireflame")}${combo}</span>` : ""}${timed ? `<span class="chip">${IMG("hourglass")}${Math.max(0, Math.ceil((LIMIT - elapsed) / 1000))}</span>` : ""}<span class="hearts">${[0, 1, 2].map(i => IMG("heart").replace('class="em"', `class="em ${i < hearts ? "" : "gone"}"`)).join("")}</span>`;
    }
    function end() {
      over = true; cancelAnimationFrame(raf); belt.classList.remove("moving");
      if (mode === "daily") setDaily("sushi", { score: yen, line: `🍣 Chef's Special ¥${yen.toLocaleString()} · ${served} plates` });
      if (yen > (S.best.sushi || 0)) S.best.sushi = yen; save();
      SFX.win(); if (served >= 10) confetti();
      const miss = [...missed.values()].slice(0, 8);
      resultScreen(st, { icon: served >= 15 ? "crown" : "sushi", title: served >= 15 ? "Five-star counter!" : "Counter closed", score: `¥${yen.toLocaleString()}`,
        lines: [`${served} plates served · best combo ${bestCombo}`, miss.length ? `<span class="muted">Review these:</span><br>${miss.map(w => `<span class="glyph">${esc(w.k)}</span> ${esc(w.r)} <span class="ro">${esc(w.ro)} · ${esc(w.en)}</span>`).join("<br>")}` : "No mix-ups. Your buds are very full."],
        share: timed ? `${APP_NAME} 🍣 Chef's Special ${todayKey()}\n¥${yen.toLocaleString()} · ${served} plates · combo ${bestCombo}\n${"🍣".repeat(Math.min(10, Math.ceil(served / 3)))}` : "",
        again: () => startSushi(mode === "daily" ? "practice" : mode) });
      setTimeout(() => newStamps.forEach(stampNow), 600);
    }
    function frame(t) {
      if (over) return; if (!last) last = t; let dt = Math.min(60, t - last); last = t; if (paused) dt = 0;
      elapsed += dt;
      const speed = Math.min(135, 48 + elapsed / 1000 * 0.9);
      const W = belt.clientWidth;
      plates.forEach(p => { p.x -= speed * dt / 1000; p.el.style.transform = `translateX(${p.x}px)`; });
      for (let i = plates.length - 1; i >= 0; i--) if (plates[i].x < -100) { if (DND.sel === plates[i].id) DND.sel = null; plates[i].el.remove(); plates.splice(i, 1); }
      const lastP = plates[plates.length - 1]; if (!lastP || lastP.x < W - 108) spawnPlate();
      seats.forEach((s, i) => {
        if (s.msg) { s.msgT -= dt; if (s.msgT <= 0) { s.msg = ""; if (!s.order) newOrder(i); else drawSeat(i); } return; }
        if (!s.order) return newOrder(i);
        s.order.t -= dt; const bar = $("#seat" + i + " .patience i", st); if (bar) { const f = Math.max(0, s.order.t / s.order.max); bar.style.width = f * 100 + "%"; bar.classList.toggle("low", f < .3); }
        if (s.order.t <= 0) { hearts--; combo = 0; missed.set(wkey(s.order.w), s.order.w); touchWord(s.order.w, false, false); s.msg = "もう…"; s.msgRo = `mou… wanted ${s.order.w.k} ${s.order.w.r}`; s.msgT = 1500; s.order = null; drawSeat(i, "shake"); SFX.bad(); drawHud(); if (hearts <= 0) return end(); }
      });
      if (over) return;
      if (timed) { if (elapsed >= LIMIT) return end(); if (Math.floor(elapsed / 1000) !== Math.floor((elapsed - dt) / 1000)) drawHud(); }
      raf = requestAnimationFrame(frame);
    }
    DND.onDrop = (pid, seat) => serve(pid, +seat);
    const vis = () => { paused = document.hidden; };
    document.addEventListener("visibilitychange", vis);
    seats.forEach((_, i) => newOrder(i)); drawHud(); raf = requestAnimationFrame(frame);
    return () => { over = true; cancelAnimationFrame(raf); document.removeEventListener("visibilitychange", vis); save(); };
  });
}

const ENDLESS_D = {};
function pzSetup(id, mode) {

}
function startTimer(hud, extra = () => "") { const t0 = now(); const draw = () => { hud.innerHTML = `${extra()}<span class="chip">${IMG("hourglass")}${fmtTime(now() - t0)}</span>`; }; draw(); const iv = setInterval(draw, 1000); return { stop: () => clearInterval(iv), ms: () => now() - t0, redraw: draw }; }

// ---------- 1. PETAL GUESS ----------
function petalGuess(mode) {
  const { daily, rng, bump } = pzSetup("petal", mode);
  const pool = UNIQUE_WORDS.filter(w => isBasic(w.r) && [...w.r].length >= 2 && [...w.r].length <= 4);
  const ans = rng.pick(pool); const A = [...ans.r]; const L = A.length; const MAXG = 6;
  openPlay("Petal Guess", (st, hud) => {
    const guesses = []; let hint = S.role === "kanji", over = false; const keyState = {};
    const timer = startTimer(hud);
    function score(g) {
      const res = Array(L).fill("miss"); const left = {};
      A.forEach((c, i) => { if (g[i] === c) res[i] = "hit"; else left[c] = (left[c] || 0) + 1; });
      g.forEach((c, i) => { if (res[i] === "hit") return; if (left[c]) { res[i] = "near"; left[c]--; } else if (KANA_ROW[c] === KANA_ROW[A[i]] || KANA_VOWEL[c] === KANA_VOWEL[A[i]]) res[i] = "kin"; });
      return res;
    }
    const rank = { hit: 3, near: 2, kin: 1, miss: 0 };
    function draw() {
      const cur = over ? [] : [...readInput($("#pgin", st) || { value: "" })].filter(c => BASIC.has(c));
      const rows = []; for (let r = 0; r < MAXG; r++) { const g = guesses[r]; rows.push(`<div class="pg-row">${Array.from({ length: L }, (_, i) => { if (g) return `<div class="pg-cell ${g.res[i]} flip" style="animation-delay:${i * .08}s">${g.k[i]}${showRo() ? `<small>${KANA_RO[g.k[i]]}</small>` : ""}</div>`; if (r === guesses.length && !over) return `<div class="pg-cell ${i === cur.length ? "cur" : ""}">${cur[i] || ""}</div>`; return `<div class="pg-cell"></div>`; }).join("")}</div>`); }
      $("#pggrid", st).innerHTML = rows.join("");
    }
    st.innerHTML = `<div class="clue" id="pgclue"></div>
      <div class="legend"><span><i style="background:var(--good)"></i>right spot</span><span><i style="background:var(--near)"></i>in the word</span><span><i style="background:var(--kin)"></i>same row or vowel</span></div>
      <div class="pg-grid" id="pggrid"></div>
      <div class="kinput"><input id="pgin" type="text" placeholder="type romaji: ya ma" aria-label="Type your guess in romaji"><button class="btn pink" id="pggo">Guess</button></div>
      <p class="typehint">Type like WaniKani: romaji turns into kana. Or tap the keys below.</p>

        const inp = $("#mhin", st); bindKana(inp); setTimeout(() => inp.focus({ preventScroll: true }), 50);
        const next = () => { r++; round(); };
        const go = () => { const v = readInput(inp); if (!v) return; if (v === p.r) { inp.classList.add("ok"); reads++; SFX.good(); say(p.r); setTimeout(next, 700); } else { inp.classList.add("no"); SFX.bad(); setTimeout(() => { inp.classList.remove("no"); inp.value = ""; toast(`It's ${p.r} (${p.ro})`); }, 500); $("#mhgo", st).textContent = "Try again"; } };
        $("#mhgo", st).onclick = go; inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); go(); } });
        $("#mhskip", st).onclick = () => { say(p.r); next(); };
      }
      DND.onDrop = (pick, drop) => {
        const x = tray[+pick.slice(1)]; if (filled[drop] === true) return;
        if (x === p[drop] || (p.a === p.b && miss.includes(drop) && x === p.a)) { filled[drop] = true; tray.splice(+pick.slice(1), 1); SFX.good(); if (filled.a && filled.b) { SFX.pop(); const w = UNIQUE_WORDS.find(w => w.k === p.k); if (w && touchWord(w, true, true)) newStamps.push(w); save(); draw(true); } else draw(); }
        else { slips++; SFX.bad(); drawHud(); const z = $(`[data-drop="${drop}"]`, st); z && (z.classList.add("shake"), setTimeout(() => z.classList.remove("shake"), 400)); }
      };
      DND.onTap = null;
      draw();
    }
    function finish() {
      const t = fmtTime(now() - t0); SFX.win(); confetti(); bump();
      const sc = `${N - Math.min(N, slips)}/${N}`; const line = `🧩 Missing Half ${slips ? slips + " slip" + (slips > 1 ? "s" : "") : "flawless"} · ${reads} reading${reads === 1 ? "" : "s"} typed`;
      if (daily) setDaily("half", { score: sc, line });
      resultScreen(st, { icon: "puzzle", title: slips ? "Kanji built!" : "Flawless intuition!", score: `${slips} slip${slips === 1 ? "" : "s"}`, lines: [`<span class="glyph" style="font-size:1.6rem">${rounds.map(x => x.p.k).join(" ")}</span>`, `${reads}/${N} readings typed · ${t}`], share: daily ? `${APP_NAME} 🧩 Missing Half ${todayKey()}\n${rounds.map(() => "🧩").join("")}\n${line.slice(3)}` : "", again: () => missingHalf("endless"), againLabel: "Endless set" });
      setTimeout(() => newStamps.forEach(stampNow), 600);
    }
    round();
  });
}

// ---------- 5. NUMBER LINE ----------
function numberLine(mode) {
  const { daily, rng, d, bump } = pzSetup("line", mode);
  const kanjiMode = S.role === "kanji";
  const face = (n, yen) => kanjiMode ? toKanji(n) + (yen ? "円" : "") : toYomi(n) + (yen ? "えん" : "");
  const roOf = (n, yen) => romaji(toYomi(n) + (yen ? "えん" : ""));
  const range = d < .3 ? [1, 10] : d < .6 ? [1, 99] : d < .85 ? [10, 999] : [100, 9999];
  const pickNums = (k) => { const s = new Set(); const [lo, hi] = range; while (s.size < k) { let n = lo + rng.int(hi - lo + 1); if (s.size && rng.f() < .4 && hi > 50) { const base = rng.pick([...s]); n = Math.max(lo, Math.min(hi, base + rng.pick([-11, -10, -1, 1, 9, 10, 100, -100]))); } s.add(n); } return [...s]; };
  const types = ["order", "gap", "price", "order", "price", "gap"];
  const rounds = types.map(t => {
    if (t === "order") { const nums = pickNums(d > .5 ? 5 : 4); return { t, items: nums.map(n => ({ n, f: face(n), ro: roOf(n) })) }; }
    if (t === "gap") { const [lo, hi] = range; let a = lo + rng.int(Math.max(1, hi - lo - 4)); let b = a + 2 + rng.int(Math.max(2, Math.min(40, Math.floor((hi - a) / 2)))); b = Math.min(b, hi + 50); const mid = a + 1 + rng.int(b - a - 1); const out1 = Math.max(0, a - 1 - rng.int(5)), out2 = b + 1 + rng.int(9); const cand = rng.shuffle([mid, out1 || b + 11, out2]); return { t, a, b, mid, items: cand.map(n => ({ n, f: face(n), ro: roOf(n) })) }; }
    const goods = rng.shuffle(KONBINI).slice(0, 4); const prices = new Set(); while (prices.size < 4) prices.add((d < .4 ? 1 + rng.int(20) : 5 + rng.int(240)) * 10); const ps = [...prices];
    return { t, items: goods.map((g, i) => ({ n: ps[i], f: face(ps[i], true), ro: roOf(ps[i], true), g })) };
  });
  openPlay("Number Line", (st, hud) => {
    let r = 0, slips = 0; const t0 = now();
    const drawHud = () => { hud.innerHTML = `<span class="chip">${Math.min(r + 1, rounds.length)}/${rounds.length}</span>${slips ? `<span class="chip">${IMG("wilted")}${slips}</span>` : ""}`; };
    function round() {
      if (r >= rounds.length) return finish(); drawHud();
      const R = rounds[r]; const slotsN = R.t === "gap" ? 1 : R.items.length; const placed = Array(slotsN).fill(-1);
      const tileHTML = (it, j) => `<button class="tile nl-tile" data-pick="n${j}">${it.g ? IMG(it.g.e) + `<span class="ro" style="font-size:.65rem">${esc(it.g.k)}</span>` : ""}<span class="glyph">${esc(it.f)}</span>${showRo() && !kanjiMode ? `<span class="ro">${esc(it.ro)}</span>` : ""}</button>`;
      const title = R.t === "order" ? "Line them up, smallest to biggest" : R.t === "gap" ? "Which number fits in the gap?" : "Konbini shelf: cheapest to most expensive";
      const caps = R.t === "price" ? ["安い yasui (cheap)", "高い takai (pricey)"] : ["小さい chiisai (small)", "大きい ookii (big)"];
      function draw(marks) {
        const slot = (i) => { const it = placed[i] >= 0 ? R.items[placed[i]] : null; return `<div class="nl-slot ${marks ? (marks[i] ? "right" : "wrong") : ""}" data-drop="s${i}">${it ? `${it.g ? IMG(it.g.e) : ""}<span class="glyph">${esc(it.f)}</span>` : `<span class="ro">${i + 1}</span>`}</div>`; };
        st.innerHTML = `<h3 style="text-align:center">${title}</h3>
          <div class="nl">${R.t === "gap" ? `<div class="nl-slot fixed"><span class="glyph">${esc(face(R.a))}</span></div>${slot(0)}<div class="nl-slot fixed"><span class="glyph">${esc(face(R.b))}</span></div>` : placed.map((_, i) => slot(i)).join("")}</div>
          <div class="nl-axis"></div><div class="nl-cap"><span>${caps[0]}</span><span>${caps[1]}</span></div>
          <div class="tiles" style="margin-top:8px">${R.items.map((it, j) => placed.includes(j) ? "" : tileHTML(it, j)).join("")}</div>
          ${placed.some(x => x >= 0) && !marks ? `<div class="row" style="justify-content:center"><button class="btn ghost small" id="nlclear">Clear</button></div>` : ""}
          <div id="nlexp"></div>`;
        const c = $("#nlclear", st); if (c) c.onclick = () => { placed.fill(-1); draw(); };
      }
      DND.onDrop = (pick, drop) => {
        const j = +pick.slice(1), i = +drop.slice(1); if (placed.includes(j)) placed[placed.indexOf(j)] = -1; placed[i] = j; SFX.tap();
        if (placed.every(x => x >= 0)) evaluate(); else draw();
      };
      DND.onTap = null;
      function evaluate() {
        let marks;
        if (R.t === "gap") marks = [R.items[placed[0]].n === R.mid];
        else { const sorted = [...R.items].map(x => x.n).sort((a, b) => a - b); marks = placed.map((j, i) => R.items[j].n === sorted[i]); }
        draw(marks);
        const exp = (R.t === "gap" ? [R.a, R.mid, R.b] : [...R.items].map(x => x.n).sort((a, b) => a - b)).map(n => `<div><span class="glyph">${esc(face(n, R.t === "price"))}</span> = <b>${n.toLocaleString()}${R.t === "price" ? "円" : ""}</b> <span class="ro">${esc(roOf(n, R.t === "price"))}</span></div>`).join("");
        if (marks.every(Boolean)) { SFX.good(); $("#nlexp", st).innerHTML = `<div class="card stack pop" style="gap:4px">${exp}<button class="btn" id="nlnext">Next</button></div>`; $("#nlnext", st).onclick = () => { r++; round(); }; }
        else { slips++; SFX.bad(); drawHud(); setTimeout(() => { placed.forEach((j, i) => { if (!marks[i]) placed[i] = -1; }); draw(); }, 900); }
      }
      draw();
    }
    function finish() {
      const t = fmtTime(now() - t0); SFX.win(); confetti(); bump();
      const line = `🧮 Number Line ${slips ? slips + " slip" + (slips > 1 ? "s" : "") : "flawless"} · ${t}`;
      if (daily) setDaily("line", { score: slips, line });
      resultScreen(st, { icon: "abacus", title: slips ? "All lined up!" : "Perfect counting!", score: `${slips} slip${slips === 1 ? "" : "s"}`, lines: [t, `<span class="muted" style="font-size:.85rem">Watch the sound changes: 300 is さんびゃく (sanbyaku) and 3,000 is さんぜん (sanzen).</span>`], share: daily ? `${APP_NAME} 🧮 Number Line ${todayKey()}\n${line.slice(3)}` : "", again: () => numberLine("endless"), againLabel: "Endless set" });
    }
    round();
  });
}

render();
</script>
